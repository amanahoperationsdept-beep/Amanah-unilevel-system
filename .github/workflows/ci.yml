name: Validate AMANAH application

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  postgres-order-item-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amanah_order_policy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amanah_order_policy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build isolated audited-schema fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amanah_order_policy_test -v ON_ERROR_STOP=1 -f tests/sql/order_item_policy_fixture.sql
      - name: Apply migration 0008 to disposable fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amanah_order_policy_test -v ON_ERROR_STOP=1 -f supabase/migrations/0008_restrict_order_items_select.sql
      - name: Verify row visibility and anonymous grants
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amanah_order_policy_test -v ON_ERROR_STOP=1 -f tests/sql/order_item_policy_test.sql
      - name: Verify restrictive-only parent policies fail closed and roll back
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres amanah_order_policy_negative
          psql -h localhost -U postgres -d amanah_order_policy_negative -v ON_ERROR_STOP=1 -f tests/sql/order_item_policy_fixture.sql
          psql -h localhost -U postgres -d amanah_order_policy_negative -v ON_ERROR_STOP=1 -c "drop policy orders_select_related on public.orders"
          psql -h localhost -U postgres -d amanah_order_policy_negative -v ON_ERROR_STOP=1 -c "create policy orders_select_related on public.orders as restrictive for select to authenticated using (buyer_id = auth.uid() or fulfillment_user_id = auth.uid() or public.is_in_my_downline(buyer_id) or public.is_amanah_admin())"
          if psql -h localhost -U postgres -d amanah_order_policy_negative -v ON_ERROR_STOP=1 -f supabase/migrations/0008_restrict_order_items_select.sql; then
            echo "Migration unexpectedly accepted restrictive-only parent visibility paths"
            exit 1
          else
            echo "Migration correctly rejected restrictive-only parent visibility paths"
          fi
          psql -h localhost -U postgres -d amanah_order_policy_negative -v ON_ERROR_STOP=1 -f tests/sql/order_item_policy_rollback_test.sql
