name: Validate AMANAH application

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build


  postgres-order-submission:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amanah_order_submission_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amanah_order_submission_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build synthetic order-submission fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amanah_order_submission_test -v ON_ERROR_STOP=1 -f tests/sql/order_submission_fixture.sql
      - name: Apply migration 0004 and test RPC validation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amanah_order_submission_test -v ON_ERROR_STOP=1 -f tests/sql/order_submission_test.sql
