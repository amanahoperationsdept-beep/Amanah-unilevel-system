name: Registration migration PostgreSQL tests

on:
  push:
    branches: [feature/amanah-pos-pricing]
    paths:
      - 'supabase/migrations/0007_activation_code_reservation_expiry.sql'
      - 'tests/sql/**'
      - '.github/workflows/registration-postgres.yml'
  pull_request:
    paths:
      - 'supabase/migrations/0007_activation_code_reservation_expiry.sql'
      - 'tests/sql/**'
      - '.github/workflows/registration-postgres.yml'

jobs:
  postgres-registration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amanah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amanah_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build disposable Supabase registration fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amanah_test -v ON_ERROR_STOP=1 -f tests/sql/registration_fixture.sql
      - name: Apply migration and run lifecycle tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amanah_test -v ON_ERROR_STOP=1 -f tests/sql/registration_migration_test.sql
