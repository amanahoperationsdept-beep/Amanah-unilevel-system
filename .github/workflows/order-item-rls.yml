name: Order item RLS migration tests

on:
  push:
    branches: [feature/order-item-rls-hardening]
    paths:
      - 'supabase/migrations/0008_restrict_order_items_select.sql'
      - 'tests/sql/order_item_policy_*.sql'
      - '.github/workflows/order-item-rls.yml'
  pull_request:
    paths:
      - 'supabase/migrations/0008_restrict_order_items_select.sql'
      - 'tests/sql/order_item_policy_*.sql'
      - '.github/workflows/order-item-rls.yml'

permissions:
  contents: read

jobs:
  postgres-order-item-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amanah_order_policy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amanah_order_policy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build isolated audited-schema fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amanah_order_policy_test -v ON_ERROR_STOP=1 -f tests/sql/order_item_policy_fixture.sql
      - name: Apply migration 0008
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amanah_order_policy_test -v ON_ERROR_STOP=1 -f supabase/migrations/0008_restrict_order_items_select.sql
      - name: Verify buyer, fulfillment, downline, unrelated-member, and admin visibility
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amanah_order_policy_test -v ON_ERROR_STOP=1 -f tests/sql/order_item_policy_test.sql
      - name: Verify migration fails closed when parent-order policy is incomplete
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres amanah_order_policy_negative
          psql -h localhost -U postgres -d amanah_order_policy_negative -v ON_ERROR_STOP=1 -f tests/sql/order_item_policy_fixture.sql
          psql -h localhost -U postgres -d amanah_order_policy_negative -v ON_ERROR_STOP=1 -c "drop policy orders_select_related on public.orders"
          if psql -h localhost -U postgres -d amanah_order_policy_negative -v ON_ERROR_STOP=1 -f supabase/migrations/0008_restrict_order_items_select.sql; then
            echo "Migration unexpectedly accepted an incomplete parent-order visibility policy"
            exit 1
          else
            echo "Migration correctly rejected an incomplete parent-order visibility policy"
          fi
          psql -h localhost -U postgres -d amanah_order_policy_negative -v ON_ERROR_STOP=1 -c "do \$\$ begin if not exists (select 1 from pg_policies where schemaname='public' and tablename='order_items' and policyname='order_items_select_related' and qual not ilike '%buyer_id%') then raise exception 'Failed migration did not roll back the original child policy'; end if; end \$\$;"
